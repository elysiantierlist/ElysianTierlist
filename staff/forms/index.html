<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domande | Area staff | Elysian Tierlist</title>
<meta name="theme-color" content="#1a0b3a">
<meta name="robots" content="noindex">
<link rel="icon" href="../../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<canvas id="stars"></canvas>
<div id="nav"></div>
<main class="wrap wide" id="app"><div class="loading">Caricamento…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../site-config.js"></script>
<script src="../../config.js"></script>
<script src="../../assets/forms-default.js"></script>
<script src="../../assets/app.js"></script>
<script>
(async function () {
  if (!(await ELY.init({ nav: 'staff', require: 'admin' }))) return;
  const esc = ELY.esc, sb = ELY.sb, D = window.ELY_DEFAULT;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const TYPES = { sec: 'Sezione (titolo)', text: 'Testo breve', number: 'Numero', url: 'Link', area: 'Risposta lunga', radio: 'Scelta singola', check: 'Scelte multiple', conf: 'Dichiarazioni (Confermo / Non confermo)' };
  const strip = (c) => { const x = clone(c); ['id', 'enabled', 'position', 'fromDb', 'isDefault'].forEach((k) => delete x[k]); x.q = x.q || []; return x; };

  /* ---------- modello ---------- */
  let ENT = {}, ORDER = [], SEL = 'common'; const OPEN = new Set();
  function build(f) {
    ENT = { common: { key: 'common', isCommon: true, cfg: strip(f.common), enabled: true, position: -1, fromDb: f.commonFromDb, isDefault: true, dirty: false } };
    f.all.forEach((r) => { ENT[r.id] = { key: r.id, cfg: strip(r), enabled: r.enabled, position: r.position, fromDb: r.fromDb, isDefault: r.isDefault, dirty: false }; });
    ORDER = f.all.map((r) => r.id);
  }
  build(await ELY.loadForms());
  const anyDirty = () => Object.values(ENT).some((e) => e.dirty);
  addEventListener('beforeunload', (e) => { if (anyDirty()) { e.preventDefault(); e.returnValue = ''; } });

  const roleTitle = (e) => (e.isCommon ? 'Domande comuni' : ((e.cfg.it && e.cfg.it.n) || e.key));
  const newId = () => 'q' + Math.random().toString(36).slice(2, 7);
  function blank(t) {
    const q = { id: newId(), t, it: t === 'sec' ? 'Nuova sezione' : 'Nuova domanda', en: t === 'sec' ? 'New section' : 'New question' };
    if (t !== 'sec') q.req = 1;
    if (t === 'text' || t === 'url') q.max = 200;
    if (t === 'area') q.max = 1500;
    if (t === 'number') { q.min = 0; q.max = 99; }
    if (t === 'radio' || t === 'check') q.o = { it: ['Opzione 1', 'Opzione 2'], en: ['Option 1', 'Option 2'] };
    if (t === 'conf') q.items = [{ it: 'Confermo di aver risposto con sincerità.', en: 'I confirm I answered honestly.' }];
    return q;
  }

  /* ---------- finestre ---------- */
  const askText = (title, ph) => new Promise((res) => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><p></p><input type="text" maxlength="30" style="margin-bottom:16px"><div class="row-flex"><button class="btn ghost small" data-x="0">Annulla</button><button class="btn small" data-x="1">Crea</button></div></div>`;
    bg.querySelector('p').textContent = title; const inp = bg.querySelector('input'); inp.placeholder = ph || '';
    const done = (v) => { bg.remove(); res(v); };
    bg.addEventListener('click', (e) => { const x = e.target.closest('[data-x]'); if (x) done(x.dataset.x === '1' ? inp.value.trim() : null); });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(inp.value.trim()); });
    document.body.appendChild(bg); inp.focus();
  });

  /* ---------- disegno ---------- */
  const lines = (a) => (Array.isArray(a) ? a : []).join('\n');
  const fld = (label, inner, extra) => `<div ${extra || ''}><label class="sublab">${label}</label>${inner}</div>`;
  const inp = (i, f, v, type, attrs) => `<input type="${type || 'text'}" data-i="${i}" data-f="${f}" value="${esc(v == null ? '' : v)}" ${attrs || ''}>`;
  const area = (i, f, v, rows) => `<textarea data-i="${i}" data-f="${f}" style="min-height:${rows || 56}px">${esc(v == null ? '' : v)}</textarea>`;

  function qBody(q, i) {
    const t = q.t; let h = '';
    h += `<div class="g2">${fld('Tipo di domanda', `<select data-i="${i}" data-f="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${k === t ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>`)}
      ${fld('ID tecnico (non modificare se non serve)', inp(i, 'id', q.id))}</div>`;
    h += `<div class="g2">${fld(t === 'sec' ? 'Titolo (italiano)' : 'Testo domanda (italiano)', area(i, 'it', q.it))}${fld(t === 'sec' ? 'Titolo (inglese)' : 'Testo domanda (inglese)', area(i, 'en', q.en))}</div>`;
    if (t === 'sec') return h;
    h += `<div class="g2">${fld('Suggerimento sotto la domanda (italiano)', area(i, 'hi_it', q.hi && q.hi.it))}${fld('Suggerimento (inglese)', area(i, 'hi_en', q.hi && q.hi.en))}</div>`;
    h += `<label class="opt" style="max-width:260px"><input type="checkbox" data-i="${i}" data-f="req" ${q.req ? 'checked' : ''}><span>Risposta obbligatoria</span></label>`;
    if (t === 'text' || t === 'url') h += `<div class="g3">${fld('Lunghezza massima', inp(i, 'max', q.max, 'number', 'min="1"'))}</div>`;
    if (t === 'number') h += `<div class="g3">${fld('Valore minimo', inp(i, 'min', q.min, 'number'))}${fld('Valore massimo', inp(i, 'max', q.max, 'number'))}</div>`;
    if (t === 'area') h += `<div class="g3">${fld('Lunghezza massima (caratteri)', inp(i, 'max', q.max, 'number', 'min="1"'))}${fld('Parole minime (vuoto = nessun minimo)', inp(i, 'w', q.w, 'number', 'min="1"'))}</div>`;
    if (t === 'radio' || t === 'check') {
      const same = Array.isArray(q.o), oit = same ? q.o : ((q.o && q.o.it) || []), oen = same ? q.o : ((q.o && q.o.en) || []);
      h += `<div class="g2">${fld('Opzioni in italiano (una per riga)', area(i, 'o_it', lines(oit), 120))}${fld('Opzioni in inglese (una per riga, stesso ordine)', area(i, 'o_en', lines(oen), 120))}</div>
        <div class="row-flex"><label class="opt"><input type="checkbox" data-i="${i}" data-f="o_same" ${same ? 'checked' : ''}><span>Le opzioni sono uguali nelle due lingue (usa solo la lista italiana)</span></label>
        <label class="opt"><input type="checkbox" data-i="${i}" data-f="two" ${q.two ? 'checked' : ''}><span>Mostrale su due colonne</span></label></div>`;
      h += `<div class="g2">${fld('Testo extra da compilare (italiano), es. "Motiva la risposta"', area(i, 'x_it', q.x && q.x.it))}${fld('Testo extra (inglese)', area(i, 'x_en', q.x && q.x.en))}</div>`;
      if (t === 'radio') h += `<div class="g3">${fld('Mostra il testo extra solo se scelta l\'opzione n° (es. 1,2). Vuoto = sempre', inp(i, 'showIf', (q.showIf || []).map((n) => n + 1).join(',')))}</div>`;
      if (t === 'check') h += `<div class="g3">${fld('Numero dell\'opzione "Altro" (0 = nessuna)', inp(i, 'other', q.otherIdx != null ? q.otherIdx + 1 : 0, 'number', 'min="0"'))}${fld('Etichetta del testo extra', inp(i, 'xPre', q.xPre || ''))}</div>`;
    }
    if (t === 'conf') {
      const it = q.items || [];
      h += `<div class="g2">${fld('Dichiarazioni in italiano (una per riga)', area(i, 'c_it', lines(it.map((x) => x.it)), 140))}${fld('Dichiarazioni in inglese (stesso ordine)', area(i, 'c_en', lines(it.map((x) => x.en)), 140))}</div>`;
    }
    return h;
  }

  function qList(e) {
    let n = 0;
    return e.cfg.q.map((q, i) => {
      const num = (!e.isCommon && q.t !== 'sec') ? ++n : '';
      const open = OPEN.has(q.id), sum = q.t === 'sec' ? `— ${q.it || ''} —` : (q.it || '(senza testo)');
      return `<div class="qe ${q.t === 'sec' ? 'sec' : ''}"><div class="qe-h" data-tog="${i}">${num !== '' ? `<span class="num">${num}</span>` : ''}<span class="t">${esc(sum)}</span><span class="ty">${esc((TYPES[q.t] || q.t).split(' (')[0])}</span>
        <button class="ib" data-act="up" data-i="${i}" title="Sposta su">↑</button><button class="ib" data-act="down" data-i="${i}" title="Sposta giù">↓</button><button class="ib red" data-act="del" data-i="${i}" title="Elimina">✕</button></div>
        ${open ? `<div class="qe-b">${qBody(q, i)}</div>` : ''}</div>`;
    }).join('') || '<div class="empty">Nessuna domanda: aggiungine una qui sotto.</div>';
  }

  function meta(e) {
    if (e.isCommon) return `<p class="muted small" style="margin-bottom:14px">Queste domande compaiono all'inizio di <b>tutte</b> le candidature. L'accesso con Discord (nome e ID) è automatico: non serve chiederlo qui.</p>`;
    const c = e.cfg;
    return `<div class="g3" style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px">
      ${fld('Nome ruolo (italiano)', `<input type="text" data-m="it.n" value="${esc(c.it && c.it.n)}">`)}${fld('Nome ruolo (inglese)', `<input type="text" data-m="en.n" value="${esc(c.en && c.en.n)}">`)}
      ${fld('Icona (emoji)', `<input type="text" data-m="ico" maxlength="4" value="${esc(c.ico)}">`)}${fld('Etichetta breve (es. 1.7)', `<input type="text" data-m="tag" maxlength="12" value="${esc(c.tag)}">`)}</div>
      <div class="g3" style="display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:12px">
      ${fld('Descrizione (italiano)', `<textarea data-m="it.d" style="min-height:60px">${esc(c.it && c.it.d)}</textarea>`)}${fld('Descrizione (inglese)', `<textarea data-m="en.d" style="min-height:60px">${esc(c.en && c.en.d)}</textarea>`)}</div>
      <div class="row-flex" style="margin-bottom:14px"><label class="opt"><input type="checkbox" id="en-on" ${e.enabled ? 'checked' : ''}><span>Candidature aperte per questo ruolo</span></label>
        <button class="btn ghost small" data-act="mv" data-d="-1">↑ Sposta su nell'elenco</button><button class="btn ghost small" data-act="mv" data-d="1">↓ Sposta giù</button>
        ${e.fromDb ? `<a class="btn ghost small" href="${esc(ELY.url('apply/?role=' + encodeURIComponent(e.key)))}" target="_blank" rel="noopener">Apri la candidatura ↗</a>` : ''}</div>`;
  }

  function draw() {
    const e = ENT[SEL];
    const left = [`common`].concat(ORDER).map((k) => { const x = ENT[k]; return `<button data-sel="${esc(k)}" class="${k === SEL ? 'on' : ''}">${esc(roleTitle(x))}${x.dirty ? ' •' : ''}<small>${x.isCommon ? 'tutte le candidature' : (x.enabled ? 'aperto' : 'chiuso')} · ${x.fromDb ? 'personalizzato' : 'predefinito'}</small></button>`; }).join('');
    ELY.setMain(`<div class="screen"><h1 class="page-title">Domande</h1><p class="page-sub">Modifica le domande di ogni candidatura. Le modifiche valgono dopo "Salva".</p>${ELY.subnav('forms')}
      <div class="ed"><div class="fl">${left}<button data-act="newrole" style="border-style:dashed">+ Nuovo ruolo</button></div>
      <div><div class="panel"><div class="row-flex"><h2 style="margin:0">${esc(roleTitle(e))}</h2><span class="spacer"></span>
          <button class="btn ghost small" data-act="json">${JSONMODE ? 'Torna all\'editor' : 'Modifica come JSON'}</button></div><div style="height:12px"></div>
        ${JSONMODE ? `<p class="muted small" style="margin-bottom:8px">Modalità avanzata: puoi cambiare qualsiasi campo. Se sbagli il formato il pulsante "Applica" ti avvisa.</p><textarea class="json" id="json">${esc(JSON.stringify(e.cfg, null, 1))}</textarea><div style="margin-top:10px"><button class="btn small" data-act="applyjson">Applica JSON</button></div>`
          : `${meta(e)}<div id="qs">${qList(e)}</div>
          <div class="row-flex" style="margin-top:14px"><select id="addt" style="max-width:280px">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${k === 'area' ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select><button class="btn small" data-act="add">+ Aggiungi</button></div>`}
      </div>
      <div class="savebar"><button class="btn" data-act="save" ${e.dirty ? '' : 'disabled'}>Salva modifiche</button>
        <button class="btn ghost small" data-act="reset" ${(e.fromDb || e.dirty) && (e.isDefault) ? '' : 'hidden'}>Ripristina predefinite</button>
        ${!e.isDefault ? '<button class="btn danger small" data-act="delrole">Elimina ruolo</button>' : ''}
        <span class="muted small" id="sv">${e.dirty ? 'Modifiche non salvate' : 'Tutto salvato'}</span></div></div></div></div>`);
  }
  let JSONMODE = false;
  const dirty = () => { const e = ENT[SEL]; e.dirty = true; const b = document.querySelector('[data-act="save"]'); if (b) b.disabled = false; const s = document.getElementById('sv'); if (s) s.textContent = 'Modifiche non salvate'; const l = document.querySelector(`[data-sel="${SEL}"]`); if (l && !l.textContent.includes('•')) l.firstChild.textContent += ' •'; };

  /* ---------- modifica dei campi ---------- */
  const num = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : undefined; };
  const pair = (obj, k, val) => { obj[k] = val; if (!obj.it && !obj.en) return undefined; return obj; };
  function applyField(q, f, el) {
    const v = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'it' || f === 'en') q[f] = v;
    else if (f === 'id') q.id = String(v).replace(/[^A-Za-z0-9_]/g, '_').slice(0, 30);
    else if (f === 'hi_it' || f === 'hi_en') { const h = Object.assign({ it: '', en: '' }, q.hi || {}); h[f.slice(3)] = v; if (!h.it && !h.en) delete q.hi; else q.hi = h; }
    else if (f === 'x_it' || f === 'x_en') { const h = Object.assign({ it: '', en: '' }, q.x || {}); h[f.slice(2)] = v; if (!h.it && !h.en) delete q.x; else q.x = h; }
    else if (f === 'req') q.req = v ? 1 : 0;
    else if (f === 'two') { if (v) q.two = 1; else delete q.two; }
    else if (f === 'max' || f === 'min' || f === 'w') { const n = num(v); if (n === undefined) delete q[f]; else q[f] = n; }
    else if (f === 'showIf') { const a = String(v).split(',').map((s) => parseInt(s, 10) - 1).filter((n) => Number.isFinite(n) && n >= 0); if (a.length) q.showIf = a; else delete q.showIf; }
    else if (f === 'other') { const n = num(v); if (n && n > 0) q.otherIdx = n - 1; else delete q.otherIdx; }
    else if (f === 'xPre') { if (v) q.xPre = v; else delete q.xPre; }
    else if (f === 'o_it' || f === 'o_en' || f === 'o_same') {
      const card = el.closest('.qe-b'), L = (n) => card.querySelector(`[data-f="${n}"]`).value.split('\n').map((s) => s.trim()).filter(Boolean);
      const same = card.querySelector('[data-f="o_same"]').checked, it = L('o_it'), en = L('o_en');
      q.o = same ? it : { it, en };
    } else if (f === 'c_it' || f === 'c_en') {
      const card = el.closest('.qe-b'), L = (n) => card.querySelector(`[data-f="${n}"]`).value.split('\n').map((s) => s.trim()).filter(Boolean);
      const it = L('c_it'), en = L('c_en'); q.items = it.map((t, i) => ({ it: t, en: en[i] || t }));
    }
  }

  const root = ELY.main();
  root.addEventListener('input', (ev) => {
    const el = ev.target, e = ENT[SEL];
    if (el.dataset.f !== undefined && el.dataset.i !== undefined && el.dataset.f !== 'type') {
      applyField(e.cfg.q[+el.dataset.i], el.dataset.f, el); dirty();
      if (el.dataset.f === 'it' || el.dataset.f === 'id') { const t = el.closest('.qe').querySelector('.qe-h .t'); const q = e.cfg.q[+el.dataset.i]; t.textContent = q.t === 'sec' ? `— ${q.it} —` : (q.it || '(senza testo)'); }
    } else if (el.dataset.m) {
      const path = el.dataset.m.split('.'); let o = e.cfg; for (let k = 0; k < path.length - 1; k++) { o[path[k]] = o[path[k]] || {}; o = o[path[k]]; } o[path[path.length - 1]] = el.value; dirty();
    }
  });
  root.addEventListener('change', async (ev) => {
    const el = ev.target, e = ENT[SEL];
    if (el.id === 'en-on') { e.enabled = el.checked; dirty(); return; }
    if (el.dataset.f === 'type') {
      const q = e.cfg.q[+el.dataset.i], keep = { id: q.id, it: q.it, en: q.en, hi: q.hi, req: q.req }; const nb = blank(el.value);
      e.cfg.q[+el.dataset.i] = Object.assign(nb, keep.hi ? { hi: keep.hi } : {}, { id: keep.id, it: keep.it, en: keep.en }); if (el.value === 'sec') { delete e.cfg.q[+el.dataset.i].req; }
      dirty(); draw();
    }
  });

  root.addEventListener('click', async (ev) => {
    const e = ENT[SEL];
    const sel = ev.target.closest('[data-sel]');
    if (sel) {
      if (sel.dataset.sel === SEL) return;
      if (e.dirty && !(await ELY.confirm('Hai modifiche non salvate in questa sezione. Vuoi scartarle?', 'Scarta'))) return;
      if (e.dirty) await discard(SEL);
      SEL = sel.dataset.sel; JSONMODE = false; draw(); return;
    }
    const tog = ev.target.closest('[data-tog]');
    const act = ev.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act, i = +act.dataset.i;
      if (a === 'up' || a === 'down') { const j = a === 'up' ? i - 1 : i + 1; const q = e.cfg.q; if (j >= 0 && j < q.length) { [q[i], q[j]] = [q[j], q[i]]; dirty(); draw(); } return; }
      if (a === 'del') { if (await ELY.confirm('Eliminare questa domanda?', 'Elimina')) { e.cfg.q.splice(i, 1); dirty(); draw(); } return; }
      if (a === 'add') { const q = blank(document.getElementById('addt').value); e.cfg.q.push(q); OPEN.add(q.id); dirty(); draw(); return; }
      if (a === 'json') { JSONMODE = !JSONMODE; draw(); return; }
      if (a === 'applyjson') {
        try { const o = JSON.parse(document.getElementById('json').value); if (!o || !Array.isArray(o.q)) throw new Error('manca la lista "q"'); e.cfg = o; dirty(); JSONMODE = false; draw(); ELY.toast('JSON applicato (ricorda di salvare)', 'ok'); }
        catch (err) { ELY.toast('JSON non valido: ' + err.message, 'err'); } return;
      }
      if (a === 'mv') { await moveRole(+act.dataset.d); return; }
      if (a === 'newrole') { await newRole(); return; }
      if (a === 'save') { await save(); return; }
      if (a === 'reset') { await resetDefault(); return; }
      if (a === 'delrole') { await deleteRole(); return; }
      return;
    }
    if (tog && !ev.target.closest('.ib')) { const q = e.cfg.q[+tog.dataset.tog]; if (OPEN.has(q.id)) OPEN.delete(q.id); else OPEN.add(q.id); draw(); }
  });

  /* ---------- azioni ---------- */
  function validate(e) {
    const ids = new Set();
    for (const q of e.cfg.q) {
      if (q.t !== 'sec') { if (!q.id) return 'Una domanda non ha ID.'; if (ids.has(q.id)) return `L'ID "${q.id}" è usato da due domande: deve essere unico.`; ids.add(q.id); }
      if (!String(q.it || '').trim()) return 'Ogni domanda e sezione deve avere il testo in italiano.';
      if ((q.t === 'radio' || q.t === 'check') && (Array.isArray(q.o) ? q.o : ((q.o && q.o.it) || [])).length < 2) return `La domanda "${q.it}" deve avere almeno 2 opzioni.`;
      if (q.t === 'radio' && !Array.isArray(q.o) && q.o && (q.o.it || []).length !== (q.o.en || []).length) return `La domanda "${q.it}": le opzioni italiane e inglesi devono essere lo stesso numero.`;
      if (q.t === 'conf' && !(q.items || []).length) return `La domanda "${q.it}" deve avere almeno una dichiarazione.`;
    }
    if (!e.isCommon && !String((e.cfg.it && e.cfg.it.n) || '').trim()) return 'Il ruolo deve avere un nome in italiano.';
    return '';
  }
  async function save() {
    const e = ENT[SEL], bad = validate(e); if (bad) { ELY.toast(bad, 'err'); return; }
    if (!e.isCommon) { e.cfg.en = e.cfg.en || {}; if (!e.cfg.en.n) e.cfg.en.n = e.cfg.it.n; if (!e.cfg.en.d) e.cfg.en.d = (e.cfg.it && e.cfg.it.d) || ''; if (!e.cfg.ico) e.cfg.ico = '⭐'; if (!e.cfg.tag) delete e.cfg.tag; }
    const row = { id: e.key, config: e.cfg, enabled: e.isCommon ? true : !!e.enabled, position: e.isCommon ? -1 : e.position, updated_at: new Date().toISOString(), updated_by: ELY.user.id };
    const { error } = await sb.from('forms').upsert(row, { onConflict: 'id' });
    if (error) { ELY.toast('Salvataggio non riuscito: ' + error.message, 'err'); return; }
    e.dirty = false; e.fromDb = true; ELY.toast('Salvato. Le modifiche sono già online.', 'ok'); draw();
  }
  async function discard(key) { const f = await ELY.loadForms(); const keep = SEL; build(f); SEL = ENT[keep] ? keep : 'common'; }
  async function resetDefault() {
    const e = ENT[SEL];
    if (!(await ELY.confirm('Ripristinare le domande predefinite? Le tue modifiche a questa sezione andranno perse.', 'Ripristina'))) return;
    if (e.fromDb) { const { error } = await sb.from('forms').delete().eq('id', e.key); if (error) { ELY.toast('Errore: ' + error.message, 'err'); return; } }
    const d = e.isCommon ? D.common : D.roles.find((r) => r.id === e.key);
    e.cfg = strip(d); e.fromDb = false; e.dirty = false; e.enabled = true; ELY.toast('Ripristinato', 'ok'); draw();
  }
  async function deleteRole() {
    const e = ENT[SEL];
    if (!(await ELY.confirm(`Eliminare il ruolo "${roleTitle(e)}"? Le candidature già inviate restano nel database.`, 'Elimina'))) return;
    if (e.fromDb) { const { error } = await sb.from('forms').delete().eq('id', e.key); if (error) { ELY.toast('Errore: ' + error.message, 'err'); return; } }
    delete ENT[SEL]; ORDER = ORDER.filter((k) => k !== SEL); SEL = 'common'; draw();
  }
  async function newRole() {
    const id = await askText('ID del nuovo ruolo (solo lettere minuscole, numeri e _)', 'es. moderatore');
    if (id === null) return;
    if (!/^[a-z0-9_]{1,30}$/.test(id) || id === 'common') { ELY.toast('ID non valido: usa solo a-z, 0-9 e _ (max 30).', 'err'); return; }
    if (ENT[id]) { ELY.toast('Esiste già un ruolo con questo ID.', 'err'); return; }
    const pos = ORDER.length ? Math.max(...ORDER.map((k) => ENT[k].position)) + 10 : 0;
    ENT[id] = { key: id, cfg: { ico: '⭐', tag: '', it: { n: id, d: '' }, en: { n: id, d: '' }, q: [] }, enabled: false, position: pos, fromDb: false, isDefault: false, dirty: true };
    ORDER.push(id); SEL = id; JSONMODE = false; draw(); ELY.toast('Ruolo creato: compilalo e premi Salva. Resta chiuso finché non lo apri.', 'ok');
  }
  async function moveRole(d) {
    if (anyDirty()) { ELY.toast('Salva (o scarta) le modifiche prima di cambiare l\'ordine.', 'err'); return; }
    const i = ORDER.indexOf(SEL), j = i + d; if (j < 0 || j >= ORDER.length) return;
    const a = ENT[ORDER[i]], b = ENT[ORDER[j]]; [a.position, b.position] = [b.position, a.position];
    if (a.position === b.position) { ORDER.forEach((k, n) => { ENT[k].position = n * 10; }); }
    const rows = [a, b].map((x) => ({ id: x.key, config: x.cfg, enabled: x.enabled, position: x.position, updated_at: new Date().toISOString(), updated_by: ELY.user.id }));
    const { error } = await sb.from('forms').upsert(rows, { onConflict: 'id' });
    if (error) { [a.position, b.position] = [b.position, a.position]; ELY.toast('Errore: ' + error.message, 'err'); return; }
    a.fromDb = b.fromDb = true; ORDER.sort((x, y) => ENT[x].position - ENT[y].position); draw();
  }

  draw();
})();
</script>
