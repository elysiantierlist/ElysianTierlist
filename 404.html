<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | Elysian Tierlist</title>
<meta name="theme-color" content="#1a0b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc72c}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Nunito',system-ui,sans-serif;color:#fff;
  background:radial-gradient(1200px 700px at 50% -10%,#4c1d95 0%,transparent 60%),linear-gradient(180deg,#2a0f5c,#12072b)}
h1{font-family:'Lilita One';font-weight:400;font-size:clamp(64px,16vw,120px);color:var(--gold);text-shadow:0 5px 0 #b45309,0 0 40px rgba(255,199,44,.5);line-height:1}
p{color:#cdb8f5;font-weight:700;margin:12px 0 24px}
a{display:inline-block;font-family:'Lilita One';font-size:19px;padding:12px 26px;border-radius:16px;color:#3b1d00;text-decoration:none;background:linear-gradient(180deg,#ffd75a,#ff9d00);box-shadow:0 5px 0 #b45309}
</style>
</head>
<body><div><h1>404</h1><p>Questa pagina non esiste.</p><a id="home" href="/">Torna alla home</a></div>
<script>
// funziona anche quando il sito sta in una sottocartella (es. /ElysianTierlist/)
(function(){var p=location.pathname.split('/').filter(Boolean);var known=['apply','account','staff','login'];var i=p.findIndex(function(x){return known.indexOf(x)>-1});
var base='/'+(i>-1?p.slice(0,i):p.slice(0,Math.max(0,p.length-1))).join('/');if(base.length>1)base+='/';document.getElementById('home').href=base;})();
</script></body></html>
