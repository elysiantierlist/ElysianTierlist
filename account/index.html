<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie candidature | Elysian Tierlist</title>
<meta name="theme-color" content="#1a0b3a">
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<canvas id="stars"></canvas>
<div id="nav"></div>
<main class="wrap" id="app"><div class="loading">Caricamento…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../site-config.js"></script>
<script src="../config.js"></script>
<script src="../assets/forms-default.js"></script>
<script src="../assets/app.js"></script>
<script>
(async function () {
  if (!(await ELY.init({ nav: 'account', require: 'user' }))) return;
  const esc = ELY.esc, p = ELY.profile;
  await ELY.loadForms();
  const { data, error } = await ELY.sb.from('applications').select('*').eq('user_id', ELY.user.id).order('created_at', { ascending: false });
  if (error) { ELY.panelMsg('Errore', 'Non riesco a caricare le tue candidature: ' + esc(error.message)); return; }
  const hint = {
    pending: 'Lo staff la sta valutando. Ti contatteremo su Discord.',
    accepted: 'Complimenti! Controlla i tuoi messaggi privati su Discord: ti contatteremo lì.',
    rejected: 'Questa volta non è andata, ma potrai ricandidarti più avanti.'
  };
  const items = (data || []).map((a) => `<div class="panel">
      <div class="row-flex"><h3 style="margin:0">${esc(ELY.roleName(a.role))}</h3>${ELY.statusBadge(a.status)}<span class="spacer"></span><span class="muted small">Inviata il ${esc(ELY.fmt(a.created_at))}</span></div>
      <p class="muted" style="margin:10px 0">${esc(hint[a.status] || '')}</p>
      <details><summary class="small" style="cursor:pointer;color:var(--gold);font-weight:800">Vedi le mie risposte</summary>
        <div class="qa" style="margin-top:12px">${(Array.isArray(a.answers) ? a.answers : []).map((x) => `<div class="q"><h4>${esc(x.q)}</h4><p>${esc(x.a)}</p></div>`).join('')}</div></details>
    </div>`).join('');
  ELY.setMain(`<div class="screen">
    <h1 class="page-title">Le mie candidature</h1><p class="page-sub">Qui vedi lo stato di ogni candidatura che hai inviato.</p>
    <div class="panel"><div class="row-flex">${ELY.avatar(p.avatar_url, p.username, 'lg')}
      <div><h3 style="margin:0">${esc(p.username)}</h3><div class="muted small">Discord ID ${esc(p.discord_id || '—')}</div><div style="margin-top:6px">${ELY.roleBadge(p.role)}</div></div>
      <span class="spacer"></span><a class="btn" href="${esc(ELY.url('apply/'))}">Nuova candidatura</a></div></div>
    ${items || `<div class="panel empty">Non hai ancora inviato nessuna candidatura.<br><br><a class="btn" href="${esc(ELY.url('apply/'))}">Candidati ora ✨</a></div>`}
  </div>`);
})();
</script>
</body>
</html>
