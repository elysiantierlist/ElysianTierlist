<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elysian Tierlist | Candidature staff</title>
<meta name="description" content="Candidature ufficiali Elysian Tierlist - Minecraft 1.7.10 - 1.21">
<meta name="theme-color" content="#1a0b3a">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<canvas id="stars"></canvas>
<div id="nav"></div>
<main class="wrap" id="app"><div class="loading">Caricamento…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="site-config.js"></script>
<script src="config.js"></script>
<script src="assets/forms-default.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  await ELY.init({ nav: 'home' });
  const forms = await ELY.loadForms();
  const esc = ELY.esc;
  const cta = ELY.user
    ? `<a class="btn" href="${esc(ELY.url('apply/'))}">Candidati ora ✨</a> <a class="btn ghost" href="${esc(ELY.url('account/'))}">Le mie candidature</a>`
    : `<button class="btn discord" id="hl">Accedi con Discord</button> <a class="btn ghost" href="${esc(ELY.url('apply/'))}">Vedi le candidature</a>`;
  const cards = forms.roles.map((r) => `<a class="card" href="${esc(ELY.url('apply/?role=' + encodeURIComponent(r.id)))}">
      <div class="ico">${esc(r.ico || '⭐')}</div><h3>${esc((r.it && r.it.n) || r.id)}</h3><p>${esc((r.it && r.it.d) || '')}</p>${r.tag ? `<span class="tag">${esc(r.tag)}</span>` : ''}</a>`).join('');
  ELY.setMain(`<div class="screen">
    <section class="hero">
      <img src="${esc(ELY.url('logo.png'))}" alt="Elysian Tiers" onerror="this.style.display='none'">
      <h1>Entra nello staff</h1>
      <p>Elysian Tierlist · Minecraft 1.7.10 – 1.21.<br>Scegli il ruolo, compila la candidatura e segui lo stato direttamente dal sito.</p>
      <div class="row-flex" style="justify-content:center">${cta}</div>
    </section>
    <h2 class="panel-title">Ruoli disponibili</h2>
    <div class="grid">${cards || '<div class="empty">Al momento non ci sono candidature aperte.</div>'}</div>
    <div class="steps3">
      <div class="panel s"><span class="n">1</span><h3>Accedi con Discord</h3><p class="muted small">Usiamo il tuo account Discord reale: niente nickname falsi.</p></div>
      <div class="panel s"><span class="n">2</span><h3>Compila la candidatura</h3><p class="muted small">Le risposte si salvano da sole: puoi riprendere più tardi.</p></div>
      <div class="panel s"><span class="n">3</span><h3>Segui lo stato</h3><p class="muted small">Dalla pagina "Le mie candidature" vedi se è in attesa, accettata o rifiutata.</p></div>
    </div></div>`);
  const hl = document.getElementById('hl'); if (hl) hl.onclick = () => ELY.login(ELY.url('apply/'));
})();
</script>
</body>
</html>
