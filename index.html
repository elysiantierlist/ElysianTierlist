<head>

<title>Elysian Tierlist | Candidature</title>
<meta name="description" content="Candidature ufficiali Elysian Tierlist - Minecraft 1.7.10 - 1.21">
<meta name="theme-color" content="#1a0b3a">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg1:#12072b; --bg2:#2a0f5c; --violet:#7c3aed; --violet2:#a855f7; --glow:#c084fc;
  --gold:#ffc72c; --gold2:#ff9d00; --ink:#fff; --muted:#cdb8f5; --card:rgba(34,16,76,.72);
  --ok:#4ade80; --err:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 50% -10%,#4c1d95 0%,transparent 60%),
             radial-gradient(900px 600px at 90% 110%,#6d28d9 0%,transparent 55%),
             linear-gradient(180deg,var(--bg2),var(--bg1));
  background-attachment:fixed;overflow-x:hidden;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 18px 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:10px}
.logo{width:min(230px,52vw);height:auto;border-radius:28px;filter:drop-shadow(0 0 28px rgba(168,85,247,.85));animation:float 4s ease-in-out infinite}
.logo-fallback{display:none;font-family:'Lilita One';font-size:64px;color:var(--gold);text-shadow:0 4px 0 #b45309,0 0 30px rgba(255,199,44,.6)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1,h2,.btn,.chip{font-family:'Lilita One',sans-serif;font-weight:400}
.title{font-size:clamp(30px,6vw,52px);line-height:1.05;margin-top:12px;color:var(--gold);
  text-shadow:0 4px 0 #b45309,0 0 26px rgba(255,199,44,.45);letter-spacing:.5px}
.sub{color:var(--muted);font-weight:700;margin-top:8px}
.steps{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.steps i{width:34px;height:7px;border-radius:9px;background:rgba(255,255,255,.18);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px rgba(255,199,44,.7)}
.screen{display:none;width:100%;animation:in .45s ease both}
.screen.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.panel-title{text-align:center;font-size:clamp(22px,4vw,32px);margin:22px 0 18px}

/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lang-grid{max-width:560px;margin:0 auto;grid-template-columns:1fr 1fr}
.card{
  position:relative;background:var(--card);border:2px solid rgba(192,132,252,.35);border-radius:22px;
  padding:22px 18px;text-align:center;cursor:pointer;color:inherit;font:inherit;
  backdrop-filter:blur(6px);transition:.25s;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(-120%);transition:.6s}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.02);border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(255,199,44,.25),0 14px 40px rgba(124,58,237,.6),0 0 30px rgba(255,199,44,.25);outline:none}
.card:hover::before{transform:translateX(120%)}
.card .ico{font-size:44px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.card h3{font-family:'Lilita One';font-weight:400;font-size:24px;color:var(--gold);text-shadow:0 2px 0 #7c2d12}
.card p{color:var(--muted);font-weight:700;font-size:14.5px;margin-top:6px}
.card .flag{font-size:54px}
.tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;
  background:rgba(255,199,44,.16);color:var(--gold);border:1px solid rgba(255,199,44,.4)}

/* buttons */
.btn{border:0;cursor:pointer;font-size:20px;padding:13px 30px;border-radius:16px;color:#3b1d00;
  background:linear-gradient(180deg,#ffd75a,var(--gold2));box-shadow:0 5px 0 #b45309,0 10px 26px rgba(255,157,0,.35);transition:.15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b45309}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.22);font-size:17px;padding:10px 20px}
.btn.ghost:hover{background:rgba(255,255,255,.16)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:17px;
  background:rgba(124,58,237,.35);border:2px solid var(--violet2);color:#fff}

/* form */
form{background:var(--card);border:2px solid rgba(192,132,252,.4);border-radius:26px;padding:clamp(18px,4vw,34px);
  backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(124,58,237,.25);max-width:760px;margin:0 auto}
.draftnote{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin:-6px 0 18px}
.sec{font-family:'Lilita One';font-weight:400;color:var(--gold);font-size:23px;margin:30px 0 16px;padding-bottom:8px;
  border-bottom:2px dashed rgba(192,132,252,.35);text-shadow:0 2px 0 #7c2d12}
.sec:first-child{margin-top:0}
.f{margin-bottom:20px;transition:.2s}
.f.bad{padding:12px;margin-left:-12px;margin-right:-12px;border-radius:16px;box-shadow:0 0 0 2px var(--err);background:rgba(251,113,133,.07)}
label,.lab{display:block;font-weight:800;margin-bottom:7px;color:#f3e8ff}
.lab .req{color:var(--gold)}
.num{display:inline-block;min-width:28px;text-align:center;margin-right:7px;padding:1px 8px;border-radius:99px;
  background:rgba(255,199,44,.18);color:var(--gold);font-size:13px;border:1px solid rgba(255,199,44,.35)}
.hint{font-size:13.5px;color:var(--muted);margin:-3px 0 8px;font-weight:700}
input[type=text],input[type=number],input[type=url],textarea{width:100%;padding:13px 15px;border-radius:14px;border:2px solid rgba(192,132,252,.35);
  background:rgba(15,6,38,.7);color:#fff;font:inherit;font-weight:700;transition:.2s}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,199,44,.18)}
.cnt{text-align:right;font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:800}
.cnt.ok{color:var(--ok)}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;align-items:flex-start;gap:10px;margin:0;padding:11px 14px;border-radius:14px;border:2px solid rgba(192,132,252,.3);
  background:rgba(15,6,38,.55);cursor:pointer;font-weight:700;color:#fff;transition:.15s;line-height:1.35}
.opt:hover{border-color:var(--violet2)}
.opt:has(input:checked){border-color:var(--gold);background:rgba(255,199,44,.11);box-shadow:0 0 14px rgba(255,199,44,.15)}
.opt input{width:auto;flex:none;margin-top:3px;accent-color:var(--gold);transform:scale(1.15)}
.xwrap{margin-top:14px}
.sublab{font-size:14.5px;color:var(--muted);font-weight:800}
.other{margin-top:10px}
.conf{display:grid;gap:10px}
.crow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;
  border:2px solid rgba(192,132,252,.25);background:rgba(15,6,38,.45)}
.ctext{flex:1 1 280px;font-weight:700;line-height:1.35}
.cbtn{display:flex;gap:8px;flex:none}
.cbtn .opt{padding:8px 12px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.msg{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:800;display:none}
.msg.err{display:block;background:rgba(251,113,133,.15);border:2px solid var(--err);color:#ffd1d9}
.done{text-align:center;max-width:560px;margin:30px auto}
.done .big{font-size:84px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.done h2{font-size:clamp(28px,6vw,42px);color:var(--gold);text-shadow:0 3px 0 #b45309;margin:10px 0}
.done p{color:var(--muted);font-weight:700;margin-bottom:22px}
footer{margin-top:auto;padding-top:40px;color:#a78bda;font-size:13px;font-weight:700;text-align:center}
@media (max-width:520px){.lang-grid{grid-template-columns:1fr}.bar{flex-wrap:wrap}.cbtn{width:100%}.cbtn .opt{flex:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Elysian Tiers" onerror="this.style.display='none';document.getElementById('lf').style.display='block'">
    <div class="logo-fallback" id="lf">ELYSIAN TIERS</div>

<script>
/* ---------- starfield ---------- */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let w,h,S=[];
  function init(){w=c.width=innerWidth;h=c.height=innerHeight;
    S=Array.from({length:Math.min(140,Math.floor(w*h/9000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.3,s:Math.random()*.4+.05,p:Math.random()*6.28,g:Math.random()<.18}))}
  function tick(t){x.clearRect(0,0,w,h);
    for(const s of S){s.y-=s.s;if(s.y<-5){s.y=h+5;s.x=Math.random()*w}
      const a=.35+.65*Math.abs(Math.sin(t/900+s.p));
      x.fillStyle=s.g?`rgba(255,199,44,${a})`:`rgba(216,180,254,${a})`;
      x.shadowBlur=s.g?10:6;x.shadowColor=s.g?'#ffc72c':'#c084fc';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
    requestAnimationFrame(tick)}
  addEventListener('resize',init);init();requestAnimationFrame(tick);
})();

/* ---------- logica ---------- */
const $=id=>document.getElementById(id);
const words=s=>(String(s).trim().match(/\S+/g)||[]).length;
const optsOf=(f,l)=>Array.isArray(f.o)?f.o:f.o[l];
let L='it',R=null,FIELDS=[];
const dk=()=>`ely_draft_${R.id}_${L}`;

const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');
  const n={'scr-lang':1,'scr-role':2,'scr-form':3,'scr-done':3}[id];['s1','s2','s3'].forEach((s,i)=>$(s).classList.toggle('on',i<n));scrollTo({top:0,behavior:'smooth'})};

function applyLang(){
  const u=UI[L];document.documentElement.lang=L;
  $('t-title').textContent=u.title;$('t-sub').textContent=u.sub;$('t-pick').textContent=u.pick;
  $('back1').textContent=u.back;$('back2').textContent=u.back;$('t-form').textContent=u.form;
  $('send').textContent=u.send;$('chip-lang').textContent=u.lang;$('draftnote').textContent=u.draft;
  $('d-title').textContent=u.doneT;$('d-text').textContent=u.doneP;$('again').textContent=u.again;
  $('roles').innerHTML='';
  ROLES.forEach(r=>{const b=document.createElement('button');b.className='card';b.type='button';
    b.innerHTML=`<div class="ico">${r.ico}</div><h3>${r[L].n}</h3><p>${r[L].d}</p>${r.tag?`<span class="tag">${r.tag}</span>`:''}`;
    b.onclick=()=>{R=r;buildForm();show('scr-form')};$('roles').appendChild(b)});
}

function labelHTML(f,forId){
  const num=f.n?`<span class="num">${f.n}</span>`:'';
  const star=f.req?' <span class="req">*</span>':'';
  return forId?`<label class="lab" for="${forId}">${num}${f[L]}${star}</label>`:`<div class="lab">${num}${f[L]}${star}</div>`;
}
function xHTML(f){
  if(!f.x)return '';
  return `<div class="xwrap" id="xw_${f.id}" ${f.showIf?'hidden':''}><label class="sublab" for="x_${f.id}">${f.x[L]} <span class="req" style="color:var(--gold)">*</span></label>
    <textarea id="x_${f.id}" maxlength="1500" style="min-height:90px"></textarea></div>`;
}

function fieldHTML(f){
  if(f.t==='sec')return `<h3 class="sec">${f[L]}</h3>`;
  let h=`<div class="f" id="w_${f.id}">`;
  if(f.t==='conf')h+='';
  else h+=labelHTML(f,(f.t==='radio'||f.t==='check')?null:'f_'+f.id);
  if(f.hi)h+=`<div class="hint">${f.hi[L]}</div>`;
  if(f.t==='area')h+=`<textarea id="f_${f.id}" maxlength="${f.max}"></textarea><div class="cnt" id="wc_${f.id}"></div>`;
  else if(f.t==='radio'){
    h+=`<div class="opts${f.two?' two':''}">${optsOf(f,L).map((o,i)=>`<label class="opt"><input type="radio" name="r_${f.id}" value="${i}"><span>${o}</span></label>`).join('')}</div>`+xHTML(f);
  }else if(f.t==='check'){
    h+=`<div class="opts two">${optsOf(f,L).map((o,i)=>`<label class="opt"><input type="checkbox" name="c_${f.id}" value="${i}"><span>${o}</span></label>`).join('')}</div>`;
    if(f.otherIdx!=null)h+=`<div class="other" id="ow_${f.id}" hidden><input type="text" id="o_${f.id}" maxlength="60" placeholder="${UI[L].other}"></div>`;
    h+=xHTML(f);
  }else if(f.t==='conf'){
    h+=`<div class="conf">${f.items.map((it,i)=>`<div class="crow"><div class="ctext">${it[L]}</div><div class="cbtn">
      <label class="opt"><input type="radio" name="k_${i}" value="1"><span>${UI[L].confirm}</span></label>
      <label class="opt"><input type="radio" name="k_${i}" value="0"><span>${UI[L].noconfirm}</span></label></div></div>`).join('')}</div>`;
  }else{
    const type=f.t==='number'?'number':f.t==='url'?'url':'text';
    h+=`<input id="f_${f.id}" type="${type}" ${f.t==='number'?`inputmode="numeric" min="${f.min||0}" max="${f.max||99}"`:`maxlength="${f.max||100}"`} ${f.t==='url'?'placeholder="https://"':''} autocomplete="off">`;
  }
  return h+'</div>';
}

function refresh(){
  FIELDS.forEach(f=>{
    if(f.t==='radio'&&f.x&&f.showIf){
      const c=document.querySelector(`input[name="r_${f.id}"]:checked`);
      $('xw_'+f.id).hidden=!(c&&f.showIf.includes(+c.value));
    }
    if(f.t==='check'&&f.otherIdx!=null){
      const c=document.querySelector(`input[name="c_${f.id}"][value="${f.otherIdx}"]`);
      $('ow_'+f.id).hidden=!c.checked;
    }
    if(f.t==='area'){
      const el=$('f_'+f.id),n=words(el.value),w=f.w||0,c=$('wc_'+f.id);
      c.textContent=w?`${n}/${w} ${UI[L].words}`:`${el.value.length}/${f.max}`;
      c.classList.toggle('ok',!!w&&n>=w);
    }
  });
}

/* bozza automatica */
function snap(){
  const o={};
  document.querySelectorAll('#fields input,#fields textarea').forEach(el=>{
    if(el.type==='radio'){if(el.checked)o[el.name]=el.value}
    else if(el.type==='checkbox'){if(el.checked)(o[el.name]=o[el.name]||[]).push(el.value)}
    else if(el.id)o[el.id]=el.value;
  });
  return o;
}
function restore(){
  let o=null;try{o=JSON.parse(localStorage.getItem(dk())||'null')}catch(_){}
  if(!o)return;
  document.querySelectorAll('#fields input,#fields textarea').forEach(el=>{
    if(el.type==='radio')el.checked=(o[el.name]===el.value);
    else if(el.type==='checkbox')el.checked=Array.isArray(o[el.name])&&o[el.name].includes(el.value);
    else if(el.id&&o[el.id]!==undefined)el.value=o[el.id];
  });
}
let dt;
function saveDraft(){clearTimeout(dt);dt=setTimeout(()=>{try{localStorage.setItem(dk(),JSON.stringify(snap()))}catch(_){}},400)}

function buildForm(){
  FIELDS=[...COMMON,...R.q];
  $('fields').innerHTML=FIELDS.map(fieldHTML).join('');
  $('msg').className='msg';
  $('chip-role').textContent=R.ico+' '+R[L].n;
  restore();refresh();
}

$('fields').addEventListener('input',e=>{const w=e.target.closest('.f');if(w)w.classList.remove('bad');refresh();saveDraft()});
$('fields').addEventListener('change',e=>{const w=e.target.closest('.f');if(w)w.classList.remove('bad');refresh();saveDraft()});

/* lettura + validazione. Le etichette inviate allo staff sono sempre in italiano. */
function collect(){
  const u=UI[L],out=[];
  const bad=(f,msg)=>{const w=$('w_'+f.id);if(w){w.classList.add('bad');w.scrollIntoView({behavior:'smooth',block:'center'})}return {err:msg||u.req}};
  for(const f of FIELDS){
    if(f.t==='sec')continue;
    const q=(f.n?f.n+'. ':'')+f.it;let a='';
    if(f.t==='text'||f.t==='url'){
      const v=$('f_'+f.id).value.trim();
      if(f.req&&!v)return bad(f);
      if(f.t==='url'&&v&&!/^https?:\/\/\S+$/i.test(v))return bad(f,u.badUrl);
      if(f.id==='discord_id'&&!/^\d{17,20}$/.test(v))return bad(f,u.badId);
      a=v||'—';
    }else if(f.t==='number'){
      const v=$('f_'+f.id).value.trim();
      if(!v)return bad(f);
      if(f.min&&+v<f.min)return bad(f,u.minAge);
      a=String(+v);
    }else if(f.t==='area'){
      const v=$('f_'+f.id).value.trim(),need=f.w||1;
      if(f.req&&words(v)<need)return bad(f,need>1?u.minWords(need):u.req);
      a=v||'—';
    }else if(f.t==='radio'){
      const c=document.querySelector(`input[name="r_${f.id}"]:checked`);
      if(!c){if(f.req)return bad(f);a='—'}
      else{
        const idx=+c.value;a=optsOf(f,'it')[idx];
        if(f.x&&(!f.showIf||f.showIf.includes(idx))){
          const tx=$('x_'+f.id).value.trim();
          if(!tx)return bad(f);
          a+=`\n→ ${tx}`;
        }
      }
    }else if(f.t==='check'){
      const cs=[...document.querySelectorAll(`input[name="c_${f.id}"]:checked`)].map(c=>+c.value);
      if(!cs.length)return bad(f);
      const it=optsOf(f,'it');
      const labs=cs.map(i=>{
        if(i===f.otherIdx){const o=$('o_'+f.id).value.trim();return o?`${it[i]}: ${o}`:it[i]}
        return it[i];
      });
      a=labs.join(', ');
      if(f.x){const tx=$('x_'+f.id).value.trim();if(!tx)return bad(f);a+=`\n${f.xPre||'→'}: ${tx}`}
    }else if(f.t==='conf'){
      const lines=[];
      for(let i=0;i<f.items.length;i++){
        const c=document.querySelector(`input[name="k_${i}"]:checked`);
        if(!c)return bad(f);
        lines.push(`${c.value==='1'?'✅':'❌'} ${f.items[i].it}`);
      }
      a=lines.join('\n');
    }
    out.push({id:f.id,q,a});
  }
  return {fields:out};
}

document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{L=b.dataset.lang;applyLang();show('scr-role')});
$('back1').onclick=()=>show('scr-lang');
$('back2').onclick=()=>show('scr-role');
$('again').onclick=()=>show('scr-role');

$('form').addEventListener('submit',async e=>{
  e.preventDefault();const u=UI[L],m=$('msg');m.className='msg';
  const f=$('form');
  if(f.website.value)return;                                   // honeypot anti-bot
  document.querySelectorAll('.f.bad').forEach(x=>x.classList.remove('bad'));
  const res=collect();
  if(res.err){m.textContent=res.err;m.className='msg err';return}
  let last=0;try{last=+localStorage.getItem('ely_last')||0}catch(_){}
  if(Date.now()-last<5*60*1000){m.textContent=u.wait;m.className='msg err';return}
  if(!window.ELYSIAN_WORKER_URL||window.ELYSIAN_WORKER_URL.includes('INSERISCI')){m.textContent=u.unavailable;m.className='msg err';return}
  const payload={role:R.id,roleName:R.en.n,lang:L,fields:res.fields};
  const btn=$('send');btn.disabled=true;btn.textContent=u.sending;
  try{
    const r=await fetch(window.ELYSIAN_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw 0;
    try{localStorage.setItem('ely_last',Date.now());localStorage.removeItem(dk())}catch(_){}
    $('fields').innerHTML='';FIELDS=[];show('scr-done');
  }catch(_){m.textContent=u.net;m.className='msg err'}
  btn.disabled=false;btn.textContent=u.send;
});

applyLang();
</script>
