<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elysian Tierlist | Candidature</title>
<meta name="description" content="Candidature ufficiali Elysian Tierlist - Minecraft 1.7.10 - 1.21">
<meta name="theme-color" content="#1a0b3a">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#12072b; --bg2:#2a0f5c; --violet:#7c3aed; --violet2:#a855f7; --glow:#c084fc;
  --gold:#ffc72c; --gold2:#ff9d00; --ink:#fff; --muted:#cdb8f5; --card:rgba(34,16,76,.72);
  --ok:#4ade80; --err:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 50% -10%,#4c1d95 0%,transparent 60%),
             radial-gradient(900px 600px at 90% 110%,#6d28d9 0%,transparent 55%),
             linear-gradient(180deg,var(--bg2),var(--bg1));
  background-attachment:fixed;overflow-x:hidden;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 18px 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:10px}
.logo{width:min(230px,52vw);height:auto;border-radius:28px;filter:drop-shadow(0 0 28px rgba(168,85,247,.85));animation:float 4s ease-in-out infinite}
.logo-fallback{display:none;font-family:'Lilita One';font-size:64px;color:var(--gold);text-shadow:0 4px 0 #b45309,0 0 30px rgba(255,199,44,.6)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1,h2,.btn,.chip{font-family:'Lilita One',sans-serif;font-weight:400}
.title{font-size:clamp(30px,6vw,52px);line-height:1.05;margin-top:12px;color:var(--gold);
  text-shadow:0 4px 0 #b45309,0 0 26px rgba(255,199,44,.45);letter-spacing:.5px}
.sub{color:var(--muted);font-weight:700;margin-top:8px}
.steps{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.steps i{width:34px;height:7px;border-radius:9px;background:rgba(255,255,255,.18);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px rgba(255,199,44,.7)}
.screen{display:none;width:100%;animation:in .45s ease both}
.screen.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.panel-title{text-align:center;font-size:clamp(22px,4vw,32px);margin:22px 0 18px}

/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.lang-grid{max-width:560px;margin:0 auto;grid-template-columns:1fr 1fr}
.card{
  position:relative;background:var(--card);border:2px solid rgba(192,132,252,.35);border-radius:22px;
  padding:22px 18px;text-align:center;cursor:pointer;color:inherit;font:inherit;
  backdrop-filter:blur(6px);transition:.25s;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(-120%);transition:.6s}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.02);border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(255,199,44,.25),0 14px 40px rgba(124,58,237,.6),0 0 30px rgba(255,199,44,.25);outline:none}
.card:hover::before{transform:translateX(120%)}
.card .ico{font-size:44px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.card h3{font-family:'Lilita One';font-weight:400;font-size:24px;color:var(--gold);text-shadow:0 2px 0 #7c2d12}
.card p{color:var(--muted);font-weight:700;font-size:14.5px;margin-top:6px}
.card .flag{font-size:54px}
.tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;
  background:rgba(255,199,44,.16);color:var(--gold);border:1px solid rgba(255,199,44,.4)}

/* buttons */
.btn{border:0;cursor:pointer;font-size:20px;padding:13px 30px;border-radius:16px;color:#3b1d00;
  background:linear-gradient(180deg,#ffd75a,var(--gold2));box-shadow:0 5px 0 #b45309,0 10px 26px rgba(255,157,0,.35);transition:.15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b45309}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.22);font-size:17px;padding:10px 20px}
.btn.ghost:hover{background:rgba(255,255,255,.16)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:17px;
  background:rgba(124,58,237,.35);border:2px solid var(--violet2);color:#fff}

/* form */
form{background:var(--card);border:2px solid rgba(192,132,252,.4);border-radius:26px;padding:clamp(18px,4vw,34px);
  backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(124,58,237,.25);max-width:720px;margin:0 auto}
.f{margin-bottom:18px}
label{display:block;font-weight:800;margin-bottom:7px;color:#f3e8ff}
label .req{color:var(--gold)}
.hint{font-size:13px;color:var(--muted);margin:-3px 0 7px;font-weight:700}
input,textarea,select{width:100%;padding:13px 15px;border-radius:14px;border:2px solid rgba(192,132,252,.35);
  background:rgba(15,6,38,.7);color:#fff;font:inherit;font-weight:700;transition:.2s}
select option{background:#1a0b3a}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,199,44,.18)}
.cnt{text-align:right;font-size:12px;color:var(--muted);margin-top:3px;font-weight:700}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.msg{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:800;display:none}
.msg.err{display:block;background:rgba(251,113,133,.15);border:2px solid var(--err);color:#ffd1d9}
.done{text-align:center;max-width:560px;margin:30px auto}
.done .big{font-size:84px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.done h2{font-size:clamp(28px,6vw,42px);color:var(--gold);text-shadow:0 3px 0 #b45309;margin:10px 0}
.done p{color:var(--muted);font-weight:700;margin-bottom:22px}
footer{margin-top:auto;padding-top:40px;color:#a78bda;font-size:13px;font-weight:700;text-align:center}
@media (max-width:520px){.lang-grid{grid-template-columns:1fr}.bar{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Elysian Tiers" onerror="this.style.display='none';document.getElementById('lf').style.display='block'">
    <div class="logo-fallback" id="lf">ELYSIAN TIERS</div>
    <h1 class="title" id="t-title">Candidature</h1>
    <p class="sub" id="t-sub">Minecraft · 1.7.10 – 1.21</p>
    <div class="steps"><i class="on" id="s1"></i><i id="s2"></i><i id="s3"></i></div>
  </header>

  <!-- STEP 1: lingua -->
  <section class="screen active" id="scr-lang">
    <h2 class="panel-title">Scegli la lingua · Choose your language</h2>
    <div class="grid lang-grid">
      <button class="card" data-lang="it"><div class="flag">🇮🇹</div><h3>Italiano</h3><p>Candidati in italiano</p></button>
      <button class="card" data-lang="en"><div class="flag">🇬🇧</div><h3>English</h3><p>Apply in English</p></button>
    </div>
  </section>

  <!-- STEP 2: ruolo -->
  <section class="screen" id="scr-role">
    <div class="bar"><button class="btn ghost" id="back1"></button><span class="chip" id="chip-lang"></span></div>
    <h2 class="panel-title" id="t-pick"></h2>
    <div class="grid" id="roles"></div>
  </section>

  <!-- STEP 3: form -->
  <section class="screen" id="scr-form">
    <div class="bar"><button class="btn ghost" id="back2"></button><span class="chip" id="chip-role"></span></div>
    <h2 class="panel-title" id="t-form"></h2>
    <form id="form" novalidate>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div id="fields"></div>
      <div style="text-align:center;margin-top:8px"><button class="btn" id="send" type="submit"></button></div>
      <div class="msg" id="msg"></div>
    </form>
  </section>

  <!-- DONE -->
  <section class="screen" id="scr-done">
    <div class="done">
      <div class="big">🏆</div>
      <h2 id="d-title"></h2>
      <p id="d-text"></p>
      <button class="btn" id="again"></button>
    </div>
  </section>

  <footer>© Elysian Tierlist · Not affiliated with Mojang or Microsoft</footer>
</div>

<script src="config.js"></script>
<script>
/* ---------- starfield ---------- */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let w,h,S=[];
  function init(){w=c.width=innerWidth;h=c.height=innerHeight;
    S=Array.from({length:Math.min(140,Math.floor(w*h/9000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.3,s:Math.random()*.4+.05,p:Math.random()*6.28,g:Math.random()<.18}))}
  function tick(t){x.clearRect(0,0,w,h);
    for(const s of S){s.y-=s.s;if(s.y<-5){s.y=h+5;s.x=Math.random()*w}
      const a=.35+.65*Math.abs(Math.sin(t/900+s.p));
      x.fillStyle=s.g?`rgba(255,199,44,${a})`:`rgba(216,180,254,${a})`;
      x.shadowBlur=s.g?10:6;x.shadowColor=s.g?'#ffc72c':'#c084fc';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
    requestAnimationFrame(tick)}
  addEventListener('resize',init);init();requestAnimationFrame(tick);
})();

/* ---------- testi ---------- */
const UI={
 it:{title:'Candidature',sub:'Minecraft · 1.7.10 – 1.21',pick:'Per cosa vuoi candidarti?',back:'← Indietro',
   form:'Compila la candidatura',send:'Invia candidatura ✨',sending:'Invio in corso…',
   req:'Compila tutti i campi obbligatori.',net:'Errore di invio. Riprova tra poco.',wait:'Hai già inviato una candidatura da poco. Riprova più tardi.',
   doneT:'Candidatura inviata!',doneP:'Il nostro staff la leggerà il prima possibile. Controlla i tuoi DM su Discord: ti contatteremo lì.',again:'Nuova candidatura',
   chars:'caratteri',select:'Seleziona…',lang:'Italiano 🇮🇹',unavailable:'Il sistema di invio non è ancora configurato.'},
 en:{title:'Applications',sub:'Minecraft · 1.7.10 – 1.21',pick:'What do you want to apply for?',back:'← Back',
   form:'Fill in your application',send:'Submit application ✨',sending:'Sending…',
   req:'Please fill in all required fields.',net:'Could not send. Please try again soon.',wait:'You already sent an application recently. Try again later.',
   doneT:'Application sent!',doneP:'Our staff will review it as soon as possible. Keep your Discord DMs open: we will contact you there.',again:'New application',
   chars:'characters',select:'Select…',lang:'English 🇬🇧',unavailable:'The submission system is not configured yet.'}
};

/* campi comuni */
const COMMON=[
 {id:'discord',t:'text',max:40,req:1,it:'Username Discord',en:'Discord username',hi:{it:'Es. nome (senza #) o username nuovo',en:'E.g. your username'}},
 {id:'discord_id',t:'text',max:25,req:1,it:'ID Discord',en:'Discord ID',hi:{it:'Sono 17-19 numeri (Modalità sviluppatore → Copia ID)',en:'17-19 digits (Developer Mode → Copy ID)'}},
 {id:'mc',t:'text',max:16,req:1,it:'Nickname Minecraft',en:'Minecraft nickname'},
 {id:'age',t:'number',min:10,max:99,req:1,it:'Età',en:'Age'}
];

/* ruoli + domande specifiche (modificale come vuoi!) */
const ROLES=[
 {id:'supporter',ico:'💜',color:'#c084fc',
  it:{n:'Supporter',d:'Aiuta la community a crescere e dai una mano allo staff.'},
  en:{n:'Supporter',d:'Help the community grow and give the staff a hand.'},
  q:[
   {id:'why',t:'area',max:600,req:1,it:'Perché vuoi diventare Supporter?',en:'Why do you want to become a Supporter?'},
   {id:'time',t:'text',max:80,req:1,it:'Da quanto sei nella community?',en:'How long have you been in the community?'},
   {id:'help',t:'area',max:500,req:1,it:'Come pensi di aiutare Elysian?',en:'How would you help Elysian?'},
   {id:'tz',t:'text',max:60,req:0,it:'Fuso orario / disponibilità',en:'Timezone / availability'}
  ]},
 {id:'ss',ico:'🛡️',color:'#60a5fa',
  it:{n:'SS Verified',d:'Screenshare e controlli anti-cheat verificati.'},
  en:{n:'SS Verified',d:'Verified screensharing and anti-cheat checks.'},
  q:[
   {id:'exp',t:'area',max:700,req:1,it:'Che esperienza hai con gli screenshare?',en:'What experience do you have with screensharing?'},
   {id:'tools',t:'area',max:500,req:1,it:'Quali programmi/tool conosci per controllare i cheat?',en:'Which programs/tools do you know to check for cheats?'},
   {id:'servers',t:'text',max:200,req:0,it:'Server / staff team in cui hai lavorato',en:'Servers / staff teams you worked in'},
   {id:'hours',t:'text',max:80,req:1,it:'Ore disponibili al giorno',en:'Hours available per day'},
   {id:'tz',t:'text',max:60,req:1,it:'Fuso orario',en:'Timezone'},
   {id:'mic',t:'select',req:1,it:'Hai un microfono e puoi usare AnyDesk/Discord?',en:'Do you have a mic and can use AnyDesk/Discord?',
     o:{it:['Sì','No'],en:['Yes','No']}}
  ]},
 {id:'dev',ico:'💻',color:'#4ade80',
  it:{n:'Developer',d:'Plugin, bot, sito e strumenti per la tierlist.'},
  en:{n:'Developer',d:'Plugins, bots, website and tools for the tierlist.'},
  q:[
   {id:'langs',t:'text',max:150,req:1,it:'Linguaggi / tecnologie che conosci',en:'Languages / technologies you know'},
   {id:'portfolio',t:'url',max:200,req:0,it:'Link GitHub o portfolio',en:'GitHub or portfolio link'},
   {id:'exp',t:'area',max:700,req:1,it:'Progetti che hai realizzato',en:'Projects you have built'},
   {id:'idea',t:'area',max:500,req:0,it:'Cosa miglioreresti in Elysian Tierlist?',en:'What would you improve in Elysian Tierlist?'},
   {id:'tz',t:'text',max:60,req:1,it:'Disponibilità settimanale',en:'Weekly availability'}
  ]},
 {id:'t18',ico:'⚔️',color:'#fb923c',tag:'1.8',
  it:{n:'Verified Tester 1.8',d:'Testa i giocatori nelle modalità della 1.8.'},
  en:{n:'Verified Tester 1.8',d:'Test players in the 1.8 gamemodes.'},
  q:[
   {id:'tier',t:'text',max:60,req:1,it:'Il tuo tier attuale (1.8)',en:'Your current tier (1.8)'},
   {id:'modes',t:'text',max:200,req:1,it:'Modalità che sai testare bene',en:'Gamemodes you can test well'},
   {id:'exp',t:'area',max:600,req:1,it:'Esperienza come tester o nelle tierlist',en:'Tester / tierlist experience'},
   {id:'proof',t:'url',max:250,req:0,it:'Link a clip o prove (YouTube, Medal…)',en:'Link to clips or proof (YouTube, Medal…)'},
   {id:'tz',t:'text',max:60,req:1,it:'Fuso orario e ore disponibili',en:'Timezone and available hours'}
  ]},
 {id:'t189',ico:'🗡️',color:'#f472b6',tag:'1.8.9',
  it:{n:'Verified Tester 1.8.9',d:'Testa i giocatori nelle modalità della 1.8.9.'},
  en:{n:'Verified Tester 1.8.9',d:'Test players in the 1.8.9 gamemodes.'},
  q:[
   {id:'tier',t:'text',max:60,req:1,it:'Il tuo tier attuale (1.8.9)',en:'Your current tier (1.8.9)'},
   {id:'modes',t:'text',max:200,req:1,it:'Modalità che sai testare bene',en:'Gamemodes you can test well'},
   {id:'exp',t:'area',max:600,req:1,it:'Esperienza come tester o nelle tierlist',en:'Tester / tierlist experience'},
   {id:'proof',t:'url',max:250,req:0,it:'Link a clip o prove (YouTube, Medal…)',en:'Link to clips or proof (YouTube, Medal…)'},
   {id:'tz',t:'text',max:60,req:1,it:'Fuso orario e ore disponibili',en:'Timezone and available hours'}
  ]}
];

/* ---------- logica ---------- */
const $=id=>document.getElementById(id);
let L='it',R=null;
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');
  const n={'scr-lang':1,'scr-role':2,'scr-form':3,'scr-done':3}[id];['s1','s2','s3'].forEach((s,i)=>$(s).classList.toggle('on',i<n));scrollTo({top:0,behavior:'smooth'})};

function applyLang(){
  const u=UI[L];document.documentElement.lang=L;
  $('t-title').textContent=u.title;$('t-sub').textContent=u.sub;$('t-pick').textContent=u.pick;
  $('back1').textContent=u.back;$('back2').textContent=u.back;$('t-form').textContent=u.form;
  $('send').textContent=u.send;$('chip-lang').textContent=u.lang;
  $('d-title').textContent=u.doneT;$('d-text').textContent=u.doneP;$('again').textContent=u.again;
  $('roles').innerHTML='';
  ROLES.forEach(r=>{const b=document.createElement('button');b.className='card';b.type='button';
    b.innerHTML=`<div class="ico">${r.ico}</div><h3>${r[L].n}</h3><p>${r[L].d}</p>${r.tag?`<span class="tag">${r.tag}</span>`:''}`;
    b.onclick=()=>{R=r;buildForm();show('scr-form')};$('roles').appendChild(b)});
}

function buildForm(){
  const u=UI[L],box=$('fields');box.innerHTML='';$('msg').className='msg';
  $('chip-role').textContent=R.ico+' '+R[L].n;
  [...COMMON,...R.q].forEach(f=>{
    const d=document.createElement('div');d.className='f';
    let h=`<label for="f_${f.id}">${f[L]}${f.req?' <span class="req">*</span>':''}</label>`;
    if(f.hi)h+=`<div class="hint">${f.hi[L]}</div>`;
    if(f.t==='area')h+=`<textarea id="f_${f.id}" name="${f.id}" maxlength="${f.max}" ${f.req?'required':''}></textarea><div class="cnt" id="c_${f.id}">0/${f.max}</div>`;
    else if(f.t==='select')h+=`<select id="f_${f.id}" name="${f.id}" ${f.req?'required':''}><option value="">${u.select}</option>${f.o[L].map(o=>`<option>${o}</option>`).join('')}</select>`;
    else h+=`<input id="f_${f.id}" name="${f.id}" type="${f.t==='number'?'number':f.t==='url'?'url':'text'}" ${f.max&&f.t!=='number'?`maxlength="${f.max}"`:''} ${f.min?`min="${f.min}" max="${f.max}"`:''} ${f.req?'required':''} ${f.t==='url'?'placeholder="https://"':''}>`;
    d.innerHTML=h;box.appendChild(d);
    const el=d.querySelector('textarea');if(el)el.oninput=()=>$('c_'+f.id).textContent=el.value.length+'/'+f.max;
  });
}

document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{L=b.dataset.lang;applyLang();show('scr-role')});
$('back1').onclick=()=>show('scr-lang');
$('back2').onclick=()=>show('scr-role');
$('again').onclick=()=>show('scr-role');

$('form').addEventListener('submit',async e=>{
  e.preventDefault();const u=UI[L],m=$('msg');m.className='msg';
  const f=$('form');
  if(f.website.value)return;                                   // honeypot anti-bot
  const all=[...COMMON,...R.q];
  for(const q of all){const v=f.elements[q.id].value.trim();
    if(q.req&&!v){m.textContent=u.req;m.className='msg err';f.elements[q.id].focus();return}}
  if(!/^\d{17,20}$/.test(f.elements.discord_id.value.trim())){m.textContent=(L==='it'?'ID Discord non valido (17-20 numeri).':'Invalid Discord ID (17-20 digits).');m.className='msg err';return}
  const last=+localStorage.getItem('ely_last')||0;
  if(Date.now()-last<10*60*1000){m.textContent=u.wait;m.className='msg err';return}
  if(!window.ELYSIAN_WORKER_URL||window.ELYSIAN_WORKER_URL.includes('INSERISCI')){m.textContent=u.unavailable;m.className='msg err';return}
  const payload={role:R.id,roleName:R.en.n,lang:L,
    fields:all.map(q=>({q:q.en,a:f.elements[q.id].value.trim()}))};
  const btn=$('send');btn.disabled=true;btn.textContent=u.sending;
  try{
    const r=await fetch(window.ELYSIAN_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)throw 0;
    localStorage.setItem('ely_last',Date.now());f.reset();show('scr-done');
  }catch(_){m.textContent=u.net;m.className='msg err'}
  btn.disabled=false;btn.textContent=u.send;
});

applyLang();
</script>
</body>
</html>
